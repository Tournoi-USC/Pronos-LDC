
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site en maintenance</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #ffffff;
      background: linear-gradient(135deg, #101827, #1e3a5f);
      padding: 20px;
    }

    .container {
      max-width: 600px;
    }

    .icon {
      font-size: 70px;
      margin-bottom: 25px;
      animation: pulse 2s infinite;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.7;
      color: #cbd5e1;
      margin-bottom: 15px;
    }

    .highlight {
      color: #60a5fa;
      font-weight: bold;
    }

    .footer {
      margin-top: 40px;
      font-size: 0.85rem;
      color: #94a3b8;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.1);
        opacity: 0.7;
      }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
      }

      p {
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="icon">🛠️</div>

    <h1>Site en maintenance</h1>

    <p>
      Nous effectuons actuellement quelques améliorations
      afin de vous offrir une meilleure expérience.
    </p>

    <p>
      Notre site sera de retour <span class="highlight">bientôt</span>.
      Merci pour votre patience et votre compréhension !
    </p>

    <div class="footer">
      &copy; 2026 — Tous droits réservés
    </div>

  </div>

</body>
</html>
